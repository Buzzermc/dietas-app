<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dietas Pablo & Alba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f6f3;--card:#fff;--header:#1a1a18;
  --text:#1a1a18;--text2:#666;--text3:#bbb;
  --border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.1);--border-dash:rgba(0,0,0,0.08);
  --ing-bg:#e6f4ed;--ing-color:#1e6b42;--ing-pill:#f0faf4;
  --rec-bg:#fff3e0;--rec-color:#a05a00;--rec-dot:#e8a020;
  --sep-bg:#fafaf8;--chip-bg:#f5f4f1;
  --green:#2d7a5a;--blue:#1e5fa0;
  --accent:#e8c547;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a1a18;--card:#252523;--header:#111110;
  --text:#f0ede8;--text2:#a0a09a;--text3:#555;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.12);--border-dash:rgba(255,255,255,0.08);
  --ing-bg:#0a3d2a;--ing-color:#5dcaa5;--ing-pill:#0f2e20;
  --rec-bg:#3a2a0a;--rec-color:#ef9f27;--rec-dot:#c47d10;
  --sep-bg:#1e1e1c;--chip-bg:#2a2a28;
  --green:#3d9e72;--blue:#378add;
}}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:15px;min-height:100vh;}

/* HEADER */
.app-header{background:var(--header);padding:16px;position:sticky;top:0;z-index:100;}
.app-header h1{font-family:'DM Serif Display',serif;font-size:20px;color:#fff;letter-spacing:-0.3px;}
.app-header p{font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;text-transform:uppercase;letter-spacing:0.3px;}

/* NAV TABS */
.nav-tabs{display:flex;background:var(--header);border-bottom:0.5px solid rgba(255,255,255,0.1);position:sticky;top:57px;z-index:100;}
.nav-tab{flex:1;padding:11px 4px;font-size:12px;color:rgba(255,255,255,0.4);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:'DM Sans',sans-serif;}
.nav-tab.active{color:#fff;border-bottom-color:var(--accent);font-weight:500;}
.nav-tab:not(.active){color:rgba(255,255,255,0.55);}

/* CONTENT */
.content{max-width:680px;margin:0 auto;padding:16px;}
.section{display:none;}.section.active{display:block;}

/* CHIPS — persona */
.person-row{display:flex;gap:8px;margin-bottom:14px;}
.chip{padding:8px 18px;border-radius:100px;font-size:13px;font-weight:500;border:0.5px solid var(--border2);background:var(--card);color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;}
.chip.ag{background:var(--green);color:#fff;border-color:var(--green);}
.chip.ab{background:var(--blue);color:#fff;border-color:var(--blue);}

/* CHIPS — plan */
.plan-row{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;}
.plan-chip{padding:6px 14px;border-radius:100px;font-size:12px;border:0.5px solid var(--border2);background:var(--card);color:var(--text2);white-space:nowrap;cursor:pointer;font-family:'DM Sans',sans-serif;}
.plan-chip.active{background:var(--text);color:var(--bg);border-color:var(--text);}

/* DÍAS */
.day-row{display:flex;gap:6px;margin-bottom:20px;}
.day-pill{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--text3);background:var(--card);border:0.5px solid var(--border2);flex-shrink:0;cursor:pointer;font-family:'DM Sans',sans-serif;}
.day-pill.active{background:var(--text);color:var(--bg);border-color:var(--text);}

/* SECCIÓN HEADER */
.sec-hdr{font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;}

/* MEAL CARD */
.meal-card{background:var(--card);border-radius:16px;margin-bottom:10px;overflow:hidden;border:0.5px solid var(--border);}
.meal-card-hdr{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;}
.meal-time{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;}
.meal-name{font-family:'DM Serif Display',serif;font-size:17px;color:var(--text);margin-top:2px;letter-spacing:-0.2px;transition:font-weight 0.15s;}
.meal-name.open{font-weight:700;}
.meal-count{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;color:var(--text3);background:var(--chip-bg);padding:2px 7px;border-radius:10px;vertical-align:middle;margin-left:4px;}
.meal-toggle{width:28px;height:28px;border-radius:50%;background:var(--chip-bg);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text2);transition:transform 0.2s;flex-shrink:0;}
.meal-toggle.open{transform:rotate(180deg);}
.meal-card-body{max-height:0;overflow:hidden;transition:max-height 0.28s ease;}
.meal-card-body.open{max-height:5000px;}
.meal-card-inner{border-top:0.5px solid var(--border);}

/* PLATO */
.dish{padding:14px 16px;}
.dish+.dish{border-top:0.5px dashed var(--border-dash);}
.dish-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:8px;padding:6px 10px;background:var(--sep-bg);border-radius:6px;border-left:3px solid var(--rec-dot);}
.dish-divider{height:0.5px;background:var(--border);margin:0 16px;}

/* BLOQUE INGREDIENTES */
.block-label{font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;padding:3px 9px;border-radius:6px;margin-bottom:7px;display:inline-block;}
.label-ing{background:var(--ing-bg);color:var(--ing-color);}
.label-rec{background:var(--rec-bg);color:var(--rec-color);}
.block-ing{margin-bottom:10px;}
.ing-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text2);padding:4px 0;border-bottom:0.5px solid var(--border);}
.ing-row:last-of-type{border:none;}
.ing-qty{color:var(--ing-color);font-weight:500;font-size:12px;background:var(--ing-pill);padding:2px 8px;border-radius:20px;white-space:nowrap;margin-left:8px;}

/* CANTIDADES CONJUNTAS */
.qty-total{font-weight:600;color:var(--text);font-size:12px;}
.qty-split{font-size:11px;color:var(--text2);margin-left:4px;}
.qty-a{color:var(--ing-color);}.qty-p{color:var(--blue);}
.solo-badge{font-size:10px;padding:1px 6px;border-radius:10px;font-weight:500;}
.solo-a{background:var(--ing-bg);color:var(--ing-color);}
.solo-p{background:#e6f1fb;color:var(--blue);}

/* PASOS */
.steps{list-style:none;counter-reset:s;margin-top:6px;}
.steps li{counter-increment:s;font-size:12.5px;color:var(--text2);padding:5px 0 5px 26px;position:relative;line-height:1.55;}
.steps li::before{content:counter(s);position:absolute;left:0;top:6px;width:17px;height:17px;border-radius:50%;background:var(--rec-dot);color:#fff;font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center;}

/* COMPRA */
.person-toggle{display:flex;gap:8px;margin-bottom:14px;}
.person-btn{flex:1;padding:10px;border:0.5px solid var(--border2);border-radius:12px;cursor:pointer;font-size:14px;background:var(--card);color:var(--text2);text-align:center;font-family:'DM Sans',sans-serif;}
.compra-cat{margin-bottom:20px;}
.compra-cat-title{font-size:11px;font-weight:500;color:var(--text3);margin:0 0 6px;padding-bottom:6px;border-bottom:0.5px solid var(--border);text-transform:uppercase;letter-spacing:0.06em;}
.compra-item{display:flex;align-items:center;gap:10px;font-size:14px;padding:7px 0;border-bottom:0.5px solid var(--border);color:var(--text);cursor:pointer;user-select:none;}
.compra-item.checked{background:#fef9e7;border-radius:8px;padding-left:8px;padding-right:8px;margin:0 -8px;}
.compra-check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.15s,border-color 0.15s;}
.compra-item.checked .compra-check{background:#e8c547;border-color:#e8c547;}
@media(prefers-color-scheme:dark){.compra-item.checked{background:#2e2a10;}}
.compra-check svg{display:none;}
.compra-item.checked .compra-check svg{display:block;}
.compra-name{flex:1;}
.compra-qty{font-size:13px;color:var(--text2);white-space:nowrap;}
.compra-qty-uni{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.compra-total{font-size:13px;font-weight:500;color:var(--text);}
.compra-split{font-size:11px;color:var(--text2);}
.compra-split-a{color:var(--ing-color);}
.compra-split-p{color:var(--blue);}

/* LEYENDA */
.legend{display:flex;gap:12px;margin-bottom:14px;font-size:12px;color:var(--text2);flex-wrap:wrap;}

/* LOADING */
.loading{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px;}
.spinner{display:inline-block;width:22px;height:22px;border:2px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:10px;}
@keyframes spin{to{transform:rotate(360deg);}}

.plan-btn-row{display:flex;gap:6px;flex-wrap:wrap;}
</style>
</head>
<body>
<div class="app-header">
  <h1>🥗 Dietas Pablo & Alba</h1>
  <p>Olga Corbín Nutrición</p>
</div>
<div class="nav-tabs">
  <button class="nav-tab active" onclick="showTab('dia')">📅 Día a día</button>
  <button class="nav-tab" onclick="showTab('conjunto')">👫 Cocinar juntos</button>
  <button class="nav-tab" onclick="showTab('compra')">🛒 La compra</button>
</div>
<div class="content">
  <div class="section active" id="tab-dia">
    <div class="person-row">
      <button class="chip ag" id="dp-alba" onclick="setDiaPer('alba')">Alba</button>
      <button class="chip" id="dp-pablo" onclick="setDiaPer('pablo')">Pablo</button>
    </div>
    <div class="plan-row" id="dia-plan-btns"></div>
    <div class="day-row" id="dia-days"></div>
    <div id="dia-content"></div>
  </div>
  <div class="section" id="tab-conjunto">
    <div class="plan-row" id="cj-plan-btns"></div>
    <div class="day-row" id="cj-days"></div>
    <div class="legend">
      <span>Total = suma de los dos.</span>
      <span><span class="solo-badge solo-a">A</span> Alba &nbsp;<span class="solo-badge solo-p">P</span> Pablo</span>
    </div>
    <div id="cj-content"></div>
  </div>
  <div class="section" id="tab-compra">
    <div class="person-toggle">
      <button class="person-btn" id="cp-alba" onclick="setCompraPer('alba')">Alba</button>
      <button class="person-btn" id="cp-pablo" onclick="setCompraPer('pablo')">Pablo</button>
      <button class="person-btn" id="cp-uni" onclick="setCompraPer('uni')">Unificada</button>
    </div>
    <div class="plan-row" id="cp-plan-btns"></div>
    <div id="compra-content"></div>
  </div>
</div>

<script>
const PLANES_CONFIG = [
  { id:'1', nombre:'Supervivencia',   archivo:'planes/plan1.json', badge:'b1' },
  { id:'2', nombre:'Bajo en potasio', archivo:'planes/plan2.json', badge:'b2' },
  { id:'3', nombre:'Plan 3',          archivo:'planes/plan3.json', badge:'b3' },
  { id:'4', nombre:'Plan 4',          archivo:'planes/plan4.json', badge:'b4' },
  // { id:'5', nombre:'Plan 5',       archivo:'planes/plan5.json', badge:'b5' },
];

const DAYS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const cache = {};
let diaPer='alba', diaPlan='1', diaDay='Lunes';
let cjPlan='1', cjDay='Lunes';
let cPer='alba', cPlan='1';

async function loadPlan(id) {
  if (cache[id]) return cache[id];
  const cfg = PLANES_CONFIG.find(p=>p.id===id);
  try {
    const r = await fetch(cfg.archivo);
    cache[id] = await r.json();
    return cache[id];
  } catch(e) { return null; }
}
function preloadAll(){ PLANES_CONFIG.forEach(p=>loadPlan(p.id)); }

function buildPlanButtons() {
  ['dia','cj','cp'].forEach(prefix => {
    const c = document.getElementById(`${prefix}-plan-btns`);
    const active = prefix==='dia' ? diaPlan : prefix==='cj' ? cjPlan : cPlan;
    const fn = prefix==='dia' ? 'setDiaPlan' : prefix==='cj' ? 'setCjPlan' : 'setCompraPlan';
    c.innerHTML = PLANES_CONFIG.map(p =>
      `<button class="plan-chip${p.id===active?' active':''}" onclick="${fn}('${p.id}')">${p.nombre}</button>`
    ).join('');
  });
}

function showTab(t) {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  ['dia','conjunto','compra'].forEach((n,i)=>{ if(n===t) document.querySelectorAll('.nav-tab')[i].classList.add('active'); });
  if(t==='dia') renderDia();
  if(t==='conjunto') renderCj();
  if(t==='compra') renderCompra();
}

function toggle(id) {
  const body = document.getElementById(id);
  const hdr  = document.getElementById('hdr-'+id);
  const name = document.getElementById('nm-'+id);
  const arr  = document.getElementById('arr-'+id);
  if (!body) return;
  body.classList.toggle('open');
  if(arr)  arr.classList.toggle('open');
  if(name) name.classList.toggle('open');
}

function buildDays(containerId, activeDay, fn) {
  const days3 = ['Lu','Ma','Mi','Ju','Vi','Sá','Do'];
  document.getElementById(containerId).innerHTML = DAYS.map((d,i) =>
    `<button class="day-pill${d===activeDay?' active':''}" onclick="${fn}('${d}')">${days3[i]}</button>`
  ).join('');
}

function loadingHtml() {
  return `<div class="loading"><div class="spinner"></div><br>Cargando...</div>`;
}

function ingHtml(ing, unified) {
  if (!ing || !ing.length) return '';
  let html = `<div class="block-ing"><span class="block-label label-ing">Ingredientes</span>`;
  ing.forEach(i => {
    if (unified) {
      const aOk = i.a != null, pOk = i.p != null;
      let qty = '';
      if (aOk && pOk) {
        qty = `<span class="qty-total">${i.a+i.p}g</span> <span class="qty-split">(<span class="qty-a">${i.a}g A</span> · <span class="qty-p">${i.p}g P</span>)</span>`;
      } else if (aOk) {
        qty = `<span class="qty-total">${i.a}g</span> <span class="qty-split"><span class="solo-badge solo-a">solo A</span></span>`;
      } else if (pOk) {
        qty = `<span class="qty-total">${i.p}g</span> <span class="qty-split"><span class="solo-badge solo-p">solo P</span></span>`;
      }
      html += `<div class="ing-row"><span>${i.n}</span><span class="ing-qty" style="background:none;color:inherit;padding:0">${qty}</span></div>`;
    } else {
      html += `<div class="ing-row"><span>${i}</span></div>`;
    }
  });
  return html + '</div>';
}

function recHtml(rec) {
  if (!rec || !rec.length) return '';
  return `<span class="block-label label-rec">Preparación</span>
    <ol class="steps">${rec.map(r=>`<li>${r}</li>`).join('')}</ol>`;
}

function dishesHtml(items, unified) {
  if (!items || !items.length) return '';
  const multi = items.length > 1;
  return items.map((it, idx) => {
    const nameHtml = multi ? `<div class="dish-name">${it.n}</div>` : '';
    const divider = multi && idx > 0 ? `<div class="dish-divider"></div>` : '';
    return `${divider}<div class="dish">${nameHtml}${ingHtml(it.ing||[], unified)}${recHtml(it.rec||[])}</div>`;
  }).join('');
}

function mealCard(meal, id, unified) {
  const items = unified
    ? (meal.platos || []).map(p => ({ n:p.n, ing:p.ing||[], rec:p.rec||[] }))
    : (meal.items  || []).map(p => ({ n:p.n, ing:p.ing||[], rec:p.rec||[] }));

  // Hora siempre en pequeño, título siempre = nombre del primer plato
  const hora  = meal.h;
  const firstName = items.length > 0 ? items[0].n : hora;
  const extra = items.length > 1 ? ` <span class="meal-count">+${items.length-1} más</span>` : '';
  const title = firstName + extra;

  return `<div class="meal-card">
    <div class="meal-card-hdr" id="hdr-${id}" onclick="toggle('${id}')">
      <div style="flex:1;min-width:0;overflow:hidden">
        <div class="meal-time">${hora}</div>
        <div class="meal-name" id="nm-${id}">${title}</div>
      </div>
      <div class="meal-toggle" id="arr-${id}">▾</div>
    </div>
    <div class="meal-card-body" id="${id}">
      <div class="meal-card-inner">${dishesHtml(items, unified)}</div>
    </div>
  </div>`;
}

function updatePlanChips(prefix, active) {
  document.querySelectorAll(`#${prefix}-plan-btns .plan-chip`).forEach((btn, i) => {
    btn.className = 'plan-chip' + (PLANES_CONFIG[i].id===active ? ' active' : '');
  });
}

// ── DÍA A DÍA ──
function setDiaPer(p) {
  diaPer = p;
  document.getElementById('dp-alba').className  = 'chip' + (p==='alba'  ? ' ag' : '');
  document.getElementById('dp-pablo').className = 'chip' + (p==='pablo' ? ' ab' : '');
  renderDia();
}
function setDiaPlan(p) { diaPlan=p; updatePlanChips('dia',p); renderDia(); }
function selDiaDay(d)  { diaDay=d; renderDia(); }

async function renderDia() {
  buildDays('dia-days', diaDay, 'selDiaDay');
  document.getElementById('dia-content').innerHTML = loadingHtml();
  const data = await loadPlan(diaPlan);
  if (!data) return;
  const meals = data.dias?.[diaPer]?.[diaDay] || [];
  const pName = diaPer==='alba' ? 'Alba' : 'Pablo';
  const planNombre = PLANES_CONFIG.find(p=>p.id===diaPlan).nombre;
  let html = `<div class="sec-hdr">${pName} · ${diaDay} · ${planNombre}</div>`;
  meals.forEach((m,i) => { html += mealCard(m, `dia-${i}`, false); });
  document.getElementById('dia-content').innerHTML = html;
}

// ── COCINAR JUNTOS ──
function setCjPlan(p) { cjPlan=p; updatePlanChips('cj',p); renderCj(); }
function selCjDay(d)  { cjDay=d; renderCj(); }

async function renderCj() {
  buildDays('cj-days', cjDay, 'selCjDay');
  document.getElementById('cj-content').innerHTML = loadingHtml();
  const data = await loadPlan(cjPlan);
  if (!data) return;
  const day = data.conjunto?.[cjDay];
  const planNombre = PLANES_CONFIG.find(p=>p.id===cjPlan).nombre;
  let html = `<div class="sec-hdr">${cjDay} · ${planNombre}</div>`;
  if (day) {
    html += mealCard(day.comida, 'cj-com', true);
    html += mealCard(day.cena,   'cj-cen', true);
  }
  document.getElementById('cj-content').innerHTML = html;
}

// ── LA COMPRA — estado de checks ──
const checkedItems = {};  // key: `${cPer}-${cPlan}-${itemName}`

function checkKey(per, plan, name) { return `${per}|${plan}|${name}`; }

function toggleCheck(el, key) {
  checkedItems[key] = !checkedItems[key];
  el.classList.toggle('checked', checkedItems[key]);
}

function parseGrams(str) {
  if (!str || str==='—') return null;
  const m = str.match(/[\d.]+/);
  return m ? parseFloat(m[0]) : null;
}

function sumQty(aq, pq) {
  const a = parseGrams(aq), p = parseGrams(pq);
  if (a==null && p==null) return '—';
  const unit = (aq||pq||'').replace(/[\d.\s]/g,'').trim() || 'g';
  const total = (a||0)+(p||0);
  return `${Number.isInteger(total)?total:total.toFixed(1)}${unit}`;
}

// ── LA COMPRA ──
function setCompraPer(p) {
  cPer = p;
  const styles = {
    alba:  'background:var(--green);color:#fff;border-color:var(--green)',
    pablo: 'background:var(--blue);color:#fff;border-color:var(--blue)',
    uni:   'background:var(--chip-bg);color:var(--text);border-color:var(--border2)',
  };
  ['alba','pablo','uni'].forEach(x => {
    document.getElementById('cp-'+x).style.cssText = p===x ? styles[x] : '';
  });
  renderCompra();
}
function setCompraPlan(p) { cPlan=p; updatePlanChips('cp',p); renderCompra(); }

async function renderCompra() {
  document.getElementById('compra-content').innerHTML = loadingHtml();
  const data = await loadPlan(cPlan);
  if (!data) return;
  const emojis = {'Leche y derivados':'🥛','Cereales y derivados':'🌾','Frutas':'🍎','Hortalizas y verduras':'🥦','Carnes, pescados y huevos':'🥩','Frutos secos y legumbres':'🥜','Aceites y condimentos':'🫒'};
  const planNombre = PLANES_CONFIG.find(p=>p.id===cPlan).nombre;
  const checkSvg = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><polyline points="1.5,6 4.5,9 10.5,3" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  let html = `<div class="sec-hdr">${cPer==='uni'?'Unificada':cPer==='alba'?'Alba':'Pablo'} · ${planNombre}</div>`;

  if (cPer==='uni') {
    const aC=data.compra?.alba||{}, pC=data.compra?.pablo||{};
    const allCats=new Set([...Object.keys(aC),...Object.keys(pC)]);
    html += `<div class="legend"><span class="compra-split-a" style="font-weight:500">A:</span> Alba &nbsp;·&nbsp; <span class="compra-split-p" style="font-weight:500">P:</span> Pablo</div>`;
    allCats.forEach(cat => {
      const aM=new Map((aC[cat]||[]).map(([n,q])=>[n,q]));
      const pM=new Map((pC[cat]||[]).map(([n,q])=>[n,q]));
      const all=new Set([...aM.keys(),...pM.keys()]);
      html+=`<div class="compra-cat"><div class="compra-cat-title">${emojis[cat]||'📦'} ${cat}</div>`;
      all.forEach(item=>{
        const aq=aM.get(item)||'—', pq=pM.get(item)||'—';
        const total=sumQty(aq,pq);
        const key=checkKey('uni',cPlan,item);
        const checked=checkedItems[key]?'checked':'';
        html+=`<div class="compra-item ${checked}" onclick="toggleCheck(this,'${key}')">
          <div class="compra-check">${checkSvg}</div>
          <span class="compra-name">${item}</span>
          <span class="compra-qty-uni">
            <span class="compra-total">${total}</span>
            <span class="compra-split"><span class="compra-split-a">A:${aq}</span> · <span class="compra-split-p">P:${pq}</span></span>
          </span>
        </div>`;
      });
      html+='</div>';
    });
  } else {
    const cats=data.compra?.[cPer]||{};
    Object.entries(cats).forEach(([cat,items])=>{
      html+=`<div class="compra-cat"><div class="compra-cat-title">${emojis[cat]||'📦'} ${cat}</div>`;
      items.forEach(([name,qty])=>{
        const key=checkKey(cPer,cPlan,name);
        const checked=checkedItems[key]?'checked':'';
        html+=`<div class="compra-item ${checked}" onclick="toggleCheck(this,'${key}')">
          <div class="compra-check">${checkSvg}</div>
          <span class="compra-name">${name}</span>
          <span class="compra-qty">${qty}</span>
        </div>`;
      });
      html+='</div>';
    });
  }
  document.getElementById('compra-content').innerHTML = html;
}

// ── INIT ──
buildPlanButtons();
setCompraPer('alba');
renderDia();
renderCj();
renderCompra();
preloadAll();
</script>
